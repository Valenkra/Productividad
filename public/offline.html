<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbf5ee" />
    <title>Sin conexión · Focus Garden</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #fbf5ee; color: #4a3d55; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 26rem; }
      h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
      p { color: #776a84; line-height: 1.5; }
      button { margin-top: 1rem; min-height: 48px; padding: 0 1.5rem; border: 1.5px solid #4a3d55; border-radius: 22px;
        background: #e8846a; color: #fff; box-shadow: 0 4px 0 #4a3d55; font-weight: 600; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Estás sin conexión</h1>
      <p>
        Tu planta te espera. Sin conexión no se acredita tiempo de foco: el servidor es quien
        lo valida. Volvé a conectarte y seguí desde donde estabas.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
